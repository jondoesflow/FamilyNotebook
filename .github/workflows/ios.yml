name: iOS

on:
  push:
    branches-ignore: [match-certificates]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload to TestFlight"
        type: boolean
        default: true
      cloudkit_env:
        description: "iCloud environment (Development for the very first build, then Production)"
        type: choice
        options: [Production, Development]
        default: Production

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (simulator, no signing)
    if: github.event_name != 'workflow_dispatch' || !inputs.testflight
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project FamilyNotebook.xcodeproj \
            -scheme FamilyNotebook \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show errors
        if: failure()
        run: grep -E "error:" -A3 build.log | head -200 || true

  testflight:
    name: Build & upload to TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write   # fastlane match stores the encrypted signing certificate on a branch
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDKIT_ENV: ${{ inputs.cloudkit_env }}
      BUILD_NUMBER: ${{ github.run_number }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID MATCH_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v (see docs/PUBLISHING.md)"; exit 1; fi
          done

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Install tools
        run: |
          brew install xcodegen
          gem install fastlane --no-document || sudo gem install fastlane --no-document
          xcodegen generate

      - name: Build, sign & upload
        run: fastlane ios beta

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gym-logs
          path: ~/Library/Logs/gym
